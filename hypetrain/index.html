<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypetrain</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.4.1/lib/p5.js"></script>
    <script>
        let train;
        let wagon;
        let windowConfiguration = [
            { x: 26, y: 18, w: 50, h: 40 },
            { x: 125, y: 18, w: 50, h: 40 },
        ];
        let trainLength = 3;
        let passengers = [];

        function preload() {
            train = loadImage('image/Heading.png');
            wagon = loadImage('image/Wagon.png');
        }
        function setup() {
            createCanvas(700, 300);
            frameRate(5);
        }

        function draw() {
            background(0, 0, 0, 0);
            image(train, 0, height - train.height);

            let index = 0;
            for (let i = 0; i < trainLength; i++) {
                const offset = createVector((train.width + 5) * (i + 1), height - wagon.height);
                for (let window of windowConfiguration) {
                    let face = passengers[index];
                    if (face)
                        image(face, offset.x + window.x, offset.y + window.y, window.w, window.h);
                    ++index;
                }
                image(wagon, offset.x, offset.y);
            }
        }

        function addPassenger(name) {
            loadImage('download_image.php?username=' + name,
                (image) => passengers.push(image),
                (err) => console.error(err)
            )
        }
    </script>
</head>

<body>
    Add supporter:
    <input type="input" id="name" />
    <button onclick="addPassenger(document.getElementById('name').value)">Button</button>

</body>

</html>
